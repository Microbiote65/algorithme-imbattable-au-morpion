  <style>
    :root {
      --bg: #09090b;
      --panel: #18181b;
      --border: #3f3f46;
      --cell-bg: #27272a;
      --cell-hover: #3f3f46;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --color-x: #60a5fa;
      --color-o: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 16px;
    }

    /* Carte principale optimisée mobile */
    body > div {
      background: var(--panel);
      padding: 1.5rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Conteneur du jeu */
    body > div > div:first-child {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Grille de jeu responsive */
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0;
      width: 100%;
      max-width: 320px;
      aspect-ratio: 1 / 1;
    }

    /* Cases du Morpion très lisibles */
    .cell {
      width: 100%;
      height: 100%;
      aspect-ratio: 1 / 1;
      background: var(--cell-bg);
      border: 2px solid var(--border);
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.4rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .cell:hover:not(.taken) {
      background: var(--cell-hover);
      border-color: #71717a;
    }

    .cell.taken {
      cursor: default;
    }

    /* Symboles X et O */
    .cell[data-val="X"] {
      color: var(--color-x);
    }

    .cell[data-val="O"] {
      color: var(--color-o);
    }

    /* Statut */
    .status {
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      min-height: 1.6rem;
      margin-top: 10px;
      color: var(--text-main);
    }

    /* Bouton Rejouer */
    #replay-btn {
      margin: 10px auto 0 auto;
      padding: 10px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      display: none;
      cursor: pointer;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
    }

    #replay-btn:hover {
      opacity: 0.9;
    }

    /* Footer compact */
    footer {
      text-align: center;
      margin-top: 1.25rem !important;
      padding: 0.5rem 0 0 0 !important;
      color: #9ca3af;
      font-size: 0.75rem;
    }

    footer a {
      transition: color 0.15s ease;
    }
    footer a:hover {
      color: var(--text-main) !important;
    }
  </style>
</head>
<body>

      <div class="board" id="board"></div>

  <script>
    const boardElem = document.getElementById("board");
    const statusElem = document.getElementById("status");
    const replayBtn = document.getElementById("replay-btn");
    let board = Array(9).fill("");
    let gameOver = false;

    const winCombos = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    function checkWinner(b) {
      for (let combo of winCombos) {
        const [a,b2,c] = combo;
        if (b[a] && b[a] === b[b2] && b[a] === b[c]) {
          return b[a];
        }
      }
      return b.includes("") ? null : "draw";
    }

    function render() {
      boardElem.innerHTML = "";
      board.forEach((val, idx) => {
        const cell = document.createElement("div");
        cell.className = "cell" + (val ? " taken" : "");
        cell.setAttribute("data-val", val);
        cell.textContent = val;
        cell.addEventListener("click", () => playerMove(idx));
        boardElem.appendChild(cell);
      });
    }

    function playerMove(i) {
      if (board[i] || gameOver) return;
      board[i] = "X";
      render();
      let result = checkWinner(board);
      if (result) return endGame(result);
      aiMove();
    }

    function aiMove() {
      let bestScore = -Infinity;
      let move;
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = "O";
          let score = minimax(board, 0, false);
          board[i] = "";
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      board[move] = "O";
      render();
      let result = checkWinner(board);
      if (result) endGame(result);
    }

    function minimax(b, depth, isMax) {
      let result = checkWinner(b);
      if (result === "O") return 10 - depth;
      if (result === "X") return depth - 10;
      if (result === "draw") return 0;

      if (isMax) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = "O";
            best = Math.max(best, minimax(b, depth + 1, false));
            b[i] = "";
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = "X";
            best = Math.min(best, minimax(b, depth + 1, true));
            b[i] = "";
          }
        }
        return best;
      }
    }

    function endGame(winner) {
      gameOver = true;
      if (winner === "draw") {
        statusElem.textContent = "Match nul !";
      } else {
        statusElem.textContent = winner + " a gagné !";
      }
      replayBtn.style.display = "inline-block";
    }

    function resetGame() {
      board = Array(9).fill("");
      gameOver = false;
      statusElem.textContent = "";
      replayBtn.style.display = "none";
      render();
    }

    render();
  </script>
